<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo - Chatbot</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <div class="chat">
        <div class="head">
            <div class="icon">🤖</div>
            <div>
                <h2>Echo AI</h2>
                <p>Chatbot Assistant</p>
            </div>
        </div>
        <div class="content" id="lblDisplay"></div>
        <div class="footer">
            <input class="txtFeild" type="text" id="userInputText" placeholder="Message Echo...">
            <button class="btnSend" onclick="btnSend()" id="btnSend">➤</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
