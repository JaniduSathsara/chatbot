<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo - chatbot</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <div class="chat">
        <div class="head">
            <div class="icon">🤖</div>
            <div>
                <h2>Echo AI</h2>
                <p>Chatbot Assistant</p>
            </div>
        </div>
        <div class="content">
            <p id="txtuserInput"></p>
            <div id="lblDisplay">
            </div>
        </div>
        <div class="footer">
            <input type="text" id="userInputText" placeholder="Type your message...">
            <input onclick="btnSend()" type="button" value="➤" id="btnSend">
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>

</body>

</html>
